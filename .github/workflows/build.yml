name: Build SENSO APKs

on: [push, workflow_dispatch]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android project
        run: flutter create --platforms=android --project-name senso_apps .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Manager
        run: flutter build apk --release -t lib/manager.dart

      - name: Build Cashier
        run: flutter build apk --release -t lib/cashier.dart

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: SENSO-Manager
          path: build/app/outputs/flutter-apk/app-release.apk
