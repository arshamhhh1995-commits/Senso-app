name: Build SENSO APKs

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name senso_apps .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Manager APK
        run: |
          flutter build apk --release -t lib/manager.dart
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/SENSO_Manager.apk

      - name: Build Cashier APK
        run: |
          flutter build apk --release -t lib/cashier.dart
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/SENSO_Cashier.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: SENSO-APK-Files
          path: artifacts/*.apk
